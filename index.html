<script>
"use strict";
window.addEventListener('error',e=>{ document.title='ERR '+e.message+' @'+e.lineno; });
// ============================================================
//  Солнечная долина — браузерный прототип (временная графика)
//  Правила: без штрафов и «смертей». Колючки/ямы/улитки просто
//  мягко возвращают на последний цветок-чекпоинт.
//  Игра НЕ связана с монетами/заданиями приложения.
// ============================================================
let W=1280; const H=720,T=48;               // экран и размер тайла
// ===== УРОВЕНЬ 2: ВЕРТИКАЛЬ — мир может быть выше экрана (ROWS задаётся уровнем), камера следует по Y =====
let ROWS=15, WH=720, camY=0; const movers=[]; let valves=[], waves=[];
// ---------- Уровень (строится кодом, проверяется ботом) ----------
function buildLevel(n){
  ROWS=(n===3)?116:(n===2)?32:15; WH=ROWS*T; const mv=[]; let arena=null; const path=[], wind=[];
  const COLS=(n===3)?100:(n===2)?402:(n===1)?691:150, g=[...Array(ROWS)].map(()=>Array(COLS).fill(' '));
  const set=(x,y,ch)=>{ if(x>=0&&x<COLS&&y>=0&&y<ROWS) g[y][x]=ch; };
  const ground=(a,b,top=12,bot=ROWS-1)=>{ for(let x=a;x<=b;x++) for(let y=top;y<=bot;y++) set(x,y,'#'); };
  const mover=(x,y,tiles,range,speed,o)=>mv.push(Object.assign({x:x*T,y:y*T,w:tiles*T,range:range*T,speed},o||{}));
  const lily=(x,y,tiles=3)=>mover(x,y,tiles,0,0,{lily:true}); const cam=[];   // кувшинка: стоячая опора, тонет под героем
  const block=(x,y,w,h)=>{ for(let i=0;i<w;i++) for(let j=0;j<h;j++) set(x+i,y+j,'#'); };
  const plat=(x,y,n)=>{ for(let i=0;i<n;i++) set(x+i,y,'='); };
  const sunPts=[];
  // не больше 3 солнышек в группе, обычно одно; ровно по центру ширины (1 — в середине, 3 — на 25%, 50%, 75% ширины)
  const suns=(x,y,n)=>{ const fr=n>=5?[.25,.5,.75]:[.5]; for(const f of fr) sunPts.push({x:Math.round((x+f*n)*T),y:y*T+T/2}); };
  const thorn=(x,k=1)=>{ for(let i=0;i<k;i++) set(x+i,11,'s'); };
  const sp=(x,y=11)=>set(x,y,'^'), put=set;
  if(n===1){
  // Зона 1: луг — учим бегать и прыгать
  ground(0,19);  suns(8,10,4);  suns(14,9,3);
  // яма 3
  ground(23,39); plat(26,9,4); suns(26,8,4); thorn(33,2); suns(32,9,4);
  set(37,11,'c');
  // Зона 2: ручей — ступеньки через воду
  ground(40,42); plat(44,10,3); plat(48,9,4); plat(53,10,3); suns(44,9,3); suns(48,8,4); suns(53,9,3);
  ground(56,75); set(60,11,'n'); suns(58,10,3); block(66,10,2,2); suns(66,9,2); thorn(74,1);
  suns(72,10,3);
  // Зона 3: холмы
  block(80,10,4,2); ground(76,98);  block(80,10,4,2); suns(80,9,4);
  plat(86,8,3); suns(86,7,3); set(86,11,'n'); thorn(95,2); suns(93,9,3);
  set(98,11,'c');
  // Зона 4: облачные ступени и финиш
  plat(101,10,3); plat(106,8,3); plat(111,10,3); plat(116,8,3); suns(101,9,3); suns(106,7,3); suns(111,9,3); suns(116,7,3);
  // удлинение: зоны A–F собраны из уже проверенных кусков (ручей, холмы, облачные ступени)
  const segA=x=>{ ground(x,x+2); plat(x+4,10,3); plat(x+8,9,4); plat(x+13,10,3); suns(x+4,9,3); suns(x+8,8,4); suns(x+13,9,3);
    ground(x+16,x+35); set(x+20,11,'n'); suns(x+18,10,3); block(x+26,10,2,2); suns(x+26,9,2); thorn(x+34,1); set(x+31,11,'c'); };
  const segB=x=>{ ground(x,x+22); block(x+4,10,4,2); suns(x+4,9,4); plat(x+10,8,3); suns(x+10,7,3); set(x+10,11,'n'); thorn(x+19,2); suns(x+17,9,3); set(x+22,11,'c'); };
  const segC=x=>{ for(let k=0;k<6;k++){ const px=x+2+5*k, py=(k%2===0)?10:8; plat(px,py,3); suns(px,py-1,3); } };
  const segD=x=>{ ground(x,x+31); set(x+6,11,'n'); thorn(x+10,2); set(x+14,11,'r'); set(x+18,8,'d'); set(x+23,11,'n'); suns(x+3,10,3); suns(x+20,9,2); set(x+28,11,'c'); };
  const segE=x=>{ ground(x,x+27); thorn(x+5,2); thorn(x+12,3); thorn(x+20,2); suns(x+4,9,4); suns(x+11,8,5); suns(x+19,9,4); set(x+16,8,'d'); set(x+25,11,'c'); };
  const segF=x=>{ for(let k=0;k<4;k++){ ground(x+10*k,x+10*k+(k===3?5:6)); suns(x+10*k+1,10,3); if(k<3) suns(x+10*k+7,8,3); } set(x+11,11,'c'); set(x+31,11,'c'); };
  // ---- новые зоны (этап 15): у каждой свой герой-препятствие, сначала в одиночку, потом в сочетании ----
  const honey=(a,b)=>{ for(let i=a;i<=b;i++) set(i,11,'y'); };
  const segG0=x=>{ ground(x,x+30); set(x+14,11,'h'); suns(x+4,10,3); suns(x+18,9,4); set(x+30,11,'c'); };                       // ёжик-клубок, один
  const segG1=x=>{ ground(x,x+30); set(x+7,11,'h'); plat(x+11,10,6); suns(x+11,9,6); thorn(x+13,3); set(x+24,11,'h'); suns(x+22,9,5); set(x+14,8,'G'); set(x+2,11,'N'); set(x+30,11,'c'); };
  const segK0=x=>{ ground(x,x+30); honey(x+6,x+13); suns(x+6,10,8); set(x+22,11,'n'); suns(x+20,9,3); set(x+30,11,'c'); };       // липкий мёд
  const segK1=x=>{ ground(x,x+30); honey(x+4,x+9); honey(x+17,x+21); plat(x+3,10,8); suns(x+3,9,8); set(x+13,11,'r'); plat(x+16,10,7); suns(x+16,9,7); set(x+25,11,'n'); set(x+19,8,'G'); set(x+30,11,'c'); };
  const segH0=x=>{ ground(x,x+30); set(x+12,11,'m'); suns(x+8,10,3); suns(x+14,10,3); block(x+20,10,2,2); suns(x+20,9,2); set(x+30,11,'c'); };      // кротик под травой
  const segH1=x=>{ ground(x,x+30); set(x+6,11,'m'); block(x+9,10,2,2); suns(x+9,9,2); set(x+14,11,'m'); block(x+17,10,2,2); suns(x+17,9,2); set(x+22,11,'m'); set(x+26,11,'n'); suns(x+4,10,3); suns(x+20,10,2); set(x+10,8,'G'); set(x+30,11,'c'); };
  const segJ0=x=>{ ground(x,x+30); set(x+11,8,'a'); suns(x+8,10,3); set(x+19,7,'a'); suns(x+16,10,4); set(x+30,11,'c'); };                       // жёлуди с дерева
  const segJ1=x=>{ ground(x,x+30); plat(x+6,10,5); suns(x+6,9,5); set(x+9,7,'a'); set(x+15,8,'a'); set(x+21,7,'a'); set(x+17,11,'n'); suns(x+14,10,3); suns(x+22,10,4); set(x+30,11,'c'); };
  const segM=x=>{ ground(x,x+37); honey(x+4,x+9); suns(x+4,10,6); set(x+14,11,'h'); set(x+24,8,'a'); suns(x+22,10,5); set(x+31,11,'m'); suns(x+29,10,4); set(x+35,11,'N'); set(x+37,11,'c'); };
  segA(120); segG0(156); segC(187); segD(218); segK0(250); segF(281); segH0(317); segE(348); segJ0(376); segB(407); segC(430);
  segG1(461); segH1(492); segK1(523); segJ1(554); segM(585); ground(623,628); segD(629);
  cam.push({x:175*T,y:6*T,say:'Хм! Вы за призмами? Не отдам!'},{x:330*T,y:5*T,say:'Ой, догнали... Призмы мои!'},{x:470*T,y:6*T,say:'Я просто хотел, чтобы со мной поиграли...'},{x:600*T,y:5*T,say:'Хранитель вас остановит. Наверное.'});
  const ar1=661;
  ground(ar1,ar1+29); set(ar1+4,11,'n'); suns(ar1+1,10,3); set(ar1+9,11,'c'); suns(ar1+13,10,4); set(ar1+21,11,'B');
  set(ar1+28,11,'F');
  set(72,11,'r'); set(28,6,'l'); set(87,6,'l'); set(117,6,'l');
  } else if(n===2){
  // Уровень 2 «Ручей и водяная башня» (32 ряда): переправа на облаках, сад дракончиков, подъём ступенями, арена Ручейника
  const G=29, AR=11;
  ground(0,12,G); suns(4,G-1,4); put(8,G-1,'c'); put(11,G-4,'d'); suns(10,G-2,2);
  mover(13,G,4,5,60); mover(27,G,4,5,60);
  ground(23,26,G); put(24,G-1,'c'); suns(15,G-3,3); suns(30,G-3,4);
  ground(37,60,G); put(40,G-1,'c'); suns(41,G-1,4); put(44,G-4,'d'); put(48,G-1,'n'); put(52,G-5,'d'); put(55,G-1,'r'); suns(46,G-3,3); suns(57,G-2,3);
  // удлинение: переправа → сад → переправа → сад (по образцу участка 0–60), затем лестница на парящий мост и вторая лестница
  const cross=e=>{ mover(e+1,G,4,5,60); ground(e+11,e+14,G); put(e+12,G-1,'c'); suns(e+3,G-3,3); suns(e+18,G-3,4); mover(e+15,G,4,5,60); };
  const garden=x=>{ ground(x,x+23,G); put(x+3,G-1,'c'); suns(x+4,G-1,4); put(x+7,G-4,'d'); put(x+11,G-1,'n'); put(x+15,G-5,'d'); put(x+18,G-1,'r'); suns(x+9,G-3,3); suns(x+20,G-2,3); };
  // новые участки ручья (этап 15): кувшинки, тонущие под ногами, и рыбки, прыгающие по кругам на воде
  const lilyRun=(e,fish)=>{ lily(e+3,G,4); suns(e+3,G-1,4); lily(e+9,G,4); suns(e+9,G-1,4); ground(e+14,e+17,G); put(e+15,G-1,'c'); lily(e+20,G,4); suns(e+20,G-1,4); for(const f of fish) put(e+f,G-1,'q'); };
  const mixRun=e=>{ mover(e+1,G,4,5,60); suns(e+3,G-3,3); ground(e+11,e+14,G); put(e+12,G-1,'c'); lily(e+16,G,4); suns(e+16,G-1,4); lily(e+21,G,4); suns(e+21,G-1,4); put(e+20,G-1,'q'); };
  const garden2=x=>{ ground(x,x+23,G); put(x+2,G-1,'c'); suns(x+4,G-1,3); put(x+6,G-4,'d'); put(x+9,G-1,'r'); put(x+13,G-5,'d'); put(x+17,G-1,'s'); put(x+18,G-1,'s'); put(x+20,G-3,'d'); suns(x+8,G-3,3); suns(x+15,G-3,3); };
  const garden3=x=>{ ground(x,x+23,G); put(x+3,G-1,'c'); put(x+6,G-1,'n'); put(x+10,G-4,'d'); suns(x+4,G-1,2); put(x+13,G-1,'r'); put(x+19,G-3,'d'); suns(x+8,G-3,3); suns(x+16,G-2,3); suns(x+21,G-1,2); };
  // паром лягушки Кваки (платформа сама едет, когда на неё встанешь) и водяной мост от рычага к тайнику с солнышками
  const ferryRun=e=>{ mover(e+1,G,5,19,90,{ferry:true}); put(e+8,G-5,'d'); put(e+16,G-5,'d'); put(e+12,G-1,'q'); suns(e+3,G-3,3); suns(e+9,G-3,4); suns(e+15,G-3,4); };

function updateHog(e,p,pb){
  e.stT-=DT; if(e.cd>0) e.cd-=DT;
  const dxh=(p.x+p.w/2)-(e.x+e.w/2), near=Math.abs(dxh)<330&&Math.abs((p.y+p.h)-(e.y+e.h))<70; let sp=0;
  if(e.st==='walk'){ sp=40; if(near&&capeT<=0&&e.cd<=0&&onScreenX(e)){ e.st='warn'; e.stT=1.0/THREAT; e.dir=dxh<0?-1:1; } }
  else if(e.st==='warn'){ if(capeT>0) e.st='walk'; else if(e.stT<=0){ e.st='roll'; e.stT=1.8; } }
  else if(e.st==='roll'){ sp=175*THREAT; e.rot+=e.dir*DT*14; if(e.stT<=0){ e.st='rest'; e.stT=1.6; } }
  else if(e.st==='rest'){ if(e.stT<=0){ e.st='walk'; e.stT=1.5; e.cd=2; } }
  e.x+=e.dir*sp*DT; const fx0=e.dir>0?e.x+e.w+2:e.x-2;
  const ahead=isSolid(Math.floor(fx0/T),Math.floor((e.y+e.h/2)/T)), floor=isSolid(Math.floor(fx0/T),Math.floor((e.y+e.h+4)/T));
  if(ahead||!floor){ e.dir*=-1; if(e.st==='roll'){ e.st='rest'; e.stT=1.2; } }
  if(overlap(p,e)){
    const st=stompOn(e,p,pb);
    if(e.st==='rest'){ if(st){ p.vy=-860; p.ground=false; p.sq=-.3; e.hit=.3; sBop(); tone(330,.25,'triangle',.09,500); puff(e.x+22,e.y+10,'#ffd9a8',6); } }
    else if(e.st==='roll'){ if(bodyHarm()) hurt('hog',e.x+e.w/2); }
    else if(st){ p.vy=-460; e.st='rest'; e.stT=1.6; sBop(); puff(e.x+22,e.y+10,'#ffd9a8',6); }
    else if(bodyHarm()) hurt('hog',e.x+e.w/2);
  }
}
// Кротик: бугорок дрожит 1 с → выскакивает на 1,4 с → прячется. Кто бежит вперёд — пробегает; кто стоит на месте — получит
function updateMole(e,p,pb){

  if(e.st==='hide'){ e.ghost=true; e.up=Math.max(0,e.up-DT*8); if(e.stT<=0&&Math.abs(dx)<300&&Math.abs((p.y+p.h)-e.gy)<140&&capeT<=0&&onScreenX(e)){ e.st='warn'; e.stT=1.0/THREAT; } }

function updateAcorn(e,p){

function updateLily(m){

      capeT=8; player.x=st.x+st.w/2-17; player.y=st.y+300; st.st='strike'; st.stT=.4; st.lx=st.x+st.w/2; st.bolt={x:st.lx-26,y0:st.y+st.h,y1:st.y+st.h+420}; player.inv=0; hurtT=0; hp=3; for(let i=0;i<5;i++) step(idle); res.push('молния бьёт сквозь плащ: энергия '+hp+(hp===2?' OK':' FAIL')); }
    log('MECH_TEST '+res.join('; ')); }
  LEVEL=1;
  // отдельные проверки физики
  resetLevel(); state='play'; let h0=player.y, minY=h0; for(let i=0;i<90;i++){ step({left:false,right:false,jump:true,jumpDown:i===0}); minY=Math.min(minY,player.y);}
  const jumpH=h0-minY; log('jumpHeightPx='+Math.round(jumpH));
  resetLevel(); state='play'; for(let i=0;i<30;i++) step({left:false,right:false,jump:false,jumpDown:false}); const tapH=player.y;
  document.title='SELFTEST '+out.join(' | ');
  document.body.insertAdjacentHTML('beforeend','<pre id="selftest">'+out.join('\n')+'</pre>');
}
window.__back=()=>{ if(state==='play'){state='pause';return true;} if(state==='pause'){state='play';return true;} if(state==='done'){state='menu';return true;} return false; };
window.__game={get state(){return state},suns:()=>suns.size,total:()=>sunTotal};
